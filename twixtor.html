<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twixtor — Maha Cutss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; }
        body { background-color: #06030c; color: #f1f5f9; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .ambient-glow { position: fixed; width: 550px; height: 550px; background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, rgba(6, 3, 12, 0) 70%); top: -120px; left: 50%; transform: translateX(-50%); pointer-events: none; }
        .nav-wrapper { position: sticky; top: 14px; z-index: 100; display: flex; justify-content: center; padding: 0 1rem; }
        .nav { width: 90%; max-width: 520px; background: rgba(20, 10, 38, 0.45); backdrop-filter: blur(28px) saturate(190%); -webkit-backdrop-filter: blur(28px) saturate(190%); border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.28); box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5), 0 0 25px rgba(139, 92, 246, 0.15); border-radius: 999px; padding: 0.65rem 1.8rem; text-align: center; animation: iosHeaderEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .brand-link { display: inline-flex; flex-direction: column; align-items: center; text-decoration: none; cursor: pointer; user-select: none; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease; }
        .brand-link:active { transform: scale(0.91) translateY(2px); filter: drop-shadow(0 0 18px rgba(167, 139, 250, 0.85)); }
        .brand-name { font-family: 'Outfit', sans-serif; font-size: 1.55rem; font-weight: 900; background: linear-gradient(135deg, #ffffff 25%, #e2d9fd 60%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-sub { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2.2px; color: #c4b5fd; margin-top: 1px; }
        @keyframes iosHeaderEntrance { 0% { opacity: 0; transform: translateY(-20px) scale(0.94); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem 4rem; position: relative; z-index: 10; width: 100%; }
        .btn-back { display: inline-flex; align-items: center; gap: 0.5rem; color: #a78bfa; font-size: 0.85rem; font-weight: 600; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(167, 139, 250, 0.25); padding: 0.55rem 1.15rem; border-radius: 12px; text-decoration: none; margin-bottom: 1.5rem; }
        .page-title { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #ffffff 40%, #c4b5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1.5rem; }
        .soon-box { text-align: center; padding: 4.5rem 1.5rem; background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(139, 92, 246, 0.02) 100%); border: 1px dashed rgba(167, 139, 250, 0.25); border-radius: 20px; max-width: 600px; margin: 1.5rem auto; }
        .soon-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem; }
        .card-desc { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
        .btn-dl { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #ffffff; padding: 0.75rem 1.5rem; border-radius: 12px; text-decoration: none; font-size: 0.8rem; font-weight: 700; margin-top: 1.5rem; }
        footer { border-top: 1px solid rgba(167, 139, 250, 0.08); padding: 1.25rem; text-align: center; color: #64748b; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="nav-wrapper">
        <nav class="nav">
            <a href="index.html" class="brand-link">
                <h1 class="brand-name">Maha Cutss</h1>
                <p class="brand-sub">Creator Suite</p>
            </a>
        </nav>
    </div>
    <div class="container">
        <a href="index.html" class="btn-back">← Back to Home</a>
        <h2 class="page-title">Twixtor Clips</h2>
        <div class="soon-box">
            <h3 class="soon-title">Soon...</h3>
            <p class="card-desc">Ultra-smooth 60fps & 120fps slow motion interpolated footages will be uploaded soon.</p>
            <a href="index.html" class="btn-dl">Back to Home</a>
        </div>
    </div>
    <footer><p>© 2026 Maha Cutss. All rights reserved.</p></footer>
</body>
</html>
